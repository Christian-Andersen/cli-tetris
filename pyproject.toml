[project]
name = "cli-tetris"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "curtsies>=0.4.3",
  "numpy>=2.4.2",
  "textual>=8.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # missing-trailing-comma
  "T20",    # flake8-print
  "ERA",    # eradicate
  "D",      # docstrings
  "CPY",    # copyright
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "prek>=0.5.3",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]
